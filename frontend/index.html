<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>选题助手前端入口</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "PingFang SC", "Noto Sans SC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1a1d15;
        background:
          radial-gradient(900px 420px at 90% -10%, rgba(56, 106, 32, 0.08), transparent 65%),
          radial-gradient(1000px 500px at -15% 0%, rgba(184, 243, 152, 0.2), transparent 62%),
          #fcfdf6;
      }
      .box {
        text-align: center;
        padding: 24px;
        border: 1px solid #dbe3d5;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      }
      .muted {
        color: #5c6359;
        font-size: 14px;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>正在跳转到控制台</h1>
      <div class="muted">如未自动跳转，请检查后端服务是否已启动。</div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
